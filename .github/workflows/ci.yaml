name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@v5
      - run: make all
      - run: docker build -t scheduled-woop:test .
      - name: Scan repository and history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --no-banner
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --no-banner
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: Scan image
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.73.0 image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 scheduled-woop:test
      - name: Generate SBOM
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" anchore/syft:v1.51.0 scheduled-woop:test -o spdx-json=/out/sbom.spdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: scheduled-woop-sbom
          path: sbom.spdx.json
