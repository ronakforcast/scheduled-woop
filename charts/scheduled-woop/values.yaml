image:
  repository: ghcr.io/ronakforcast/scheduled-woop
  tag: "0.2.0"
  pullPolicy: IfNotPresent

# Create this Secret before installing the chart. The API key never belongs in values.yaml.
existingSecret: castai-api-credentials

config:
  clusterId: replace-with-cast-cluster-id
  timezone: Europe/Prague
  pollInterval: 1m
  schedules:
    - name: application-one
      managedPolicyId: replace-with-policy-a-id
      defaultProfile:
        name: off-hours
        policyId: replace-with-policy-c-id
      windows:
        - name: business-hours
          days: [Monday, Tuesday, Wednesday, Thursday, Friday]
          start: "08:00"
          end: "18:00"
          profile:
            name: business-hours
            policyId: replace-with-policy-b-id

    - name: application-two
      managedPolicyId: replace-with-policy-d-id
      defaultProfile:
        name: normal
        policyId: replace-with-policy-f-id
      windows:
        - name: batch-window
          days: [Saturday, Sunday]
          start: "20:00"
          end: "06:00"
          profile:
            name: batch
            policyId: replace-with-policy-e-id

resources:
  requests: {cpu: 10m, memory: 16Mi}
  limits: {cpu: 100m, memory: 64Mi}
