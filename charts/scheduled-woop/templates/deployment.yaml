apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "scheduled-woop.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: scheduled-woop
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduled-woop
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: scheduled-woop
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: scheduled-woop
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          env:
            - {name: CONFIG_PATH, value: /etc/scheduled-woop/config.yaml}
            - {name: CAST_API_KEY_FILE, value: /etc/scheduled-woop-secret/api-key}
          volumeMounts:
            - {name: config, mountPath: /etc/scheduled-woop, readOnly: true}
            - {name: api-key, mountPath: /etc/scheduled-woop-secret, readOnly: true}
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "scheduled-woop.fullname" . }}
        - name: api-key
          secret:
            secretName: {{ required "existingSecret is required" .Values.existingSecret }}
